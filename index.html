<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig player</title>
<!--
  The digging bot's player: a Telegram Mini App that plays one reply's tracks
  in order, through the services' own embeddable players.

  The track list travels in the URL fragment (#t=…), deflate-compressed and
  base64url-encoded by python/bot/player.py. A fragment is never sent to the
  server, so this page is static: no backend, nothing stored, nothing logged.

  YouTube and SoundCloud report when a track ends, so the queue advances by
  itself. A Bandcamp release plays whole in Bandcamp's own embedded player,
  track list included; that player reports nothing, so ⏭ moves on from it.
  A Bandcamp link with no release id is opened in the browser instead.

  Browsers do not let a page start sound on its own, so the first track
  starts on a tap; the rest follow.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #111);
    --fg: var(--tg-theme-text-color, #eee);
    --muted: var(--tg-theme-hint-color, #888);
    --accent: var(--tg-theme-button-color, #3b82f6);
    --accent-fg: var(--tg-theme-button-text-color, #fff);
    --card: var(--tg-theme-secondary-bg-color, #1c1c1c);
  }
  * { box-sizing: border-box; }
  /* "display: flex" on #start would otherwise outrank the browser's own
     [hidden] rule, and the start overlay never went away. */
  [hidden] { display: none !important; }
  /* Telegram Desktop's panel is narrower than the width it reports; keep
     everything inside it rather than cut off at the right edge. */
  html, body { overflow-x: hidden; max-width: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
           border-radius: 10px; overflow: hidden; }
  #stage.sc { aspect-ratio: auto; height: 166px; }
  #stage.bc { aspect-ratio: auto; height: 472px; background: transparent; }
  #stage > div, #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           background: rgba(0,0,0,.55); color: #fff; font-size: 18px; border: 0; cursor: pointer; z-index: 2; }
  #now { margin: 12px 2px 8px; min-height: 2.7em; }
  #now .artist { font-weight: 600; }
  #now .where { color: var(--muted); font-size: 13px; }
  #controls { display: flex; gap: 8px; margin-bottom: 12px; }
  #controls button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-size: 16px;
                     background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  #controls button:disabled { opacity: .4; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; align-items: baseline; padding: 9px 10px; border-radius: 8px;
       background: var(--card); margin-bottom: 6px; cursor: pointer; }
  li.current { outline: 2px solid var(--accent); }
  li .n { color: var(--muted); min-width: 1.6em; text-align: right; }
  li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li .p { color: var(--muted); font-size: 12px; flex-shrink: 0; }
  button.bc { background: none; border: 1px solid var(--accent); color: var(--accent);
              border-radius: 6px; font-size: 12px; padding: 2px 6px; cursor: pointer;
              flex-shrink: 0; }
  #now button.bc { margin-top: 6px; font-size: 14px; padding: 4px 10px; }
  li .star, #star { background: none; border: 0; color: var(--accent); font-size: 18px;
                    line-height: 1; padding: 0 2px; cursor: pointer; flex-shrink: 0; }
  #error { color: #f87171; margin: 1em 0; }
</style>
</head>
<body>
<div id="stage"><div id="yt"></div><button id="start" hidden>▶ Нажми, чтобы начать</button></div>
<div id="now"></div>
<div id="controls">
  <button id="prev" aria-label="Предыдущий">⏮</button>
  <button id="open" aria-label="Открыть в сервисе">↗</button>
  <button id="next" aria-label="Следующий">⏭</button>
</div>
<div id="error" hidden></div>
<ol id="list"></ol>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  // A swipe down scrolls the page instead of folding the Mini App away.
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

const LABEL = { y: "YouTube", s: "SoundCloud", b: "Bandcamp" };
let tracks = [];          // [{p, id, artist, title}]
let current = -1;
let ytPlayer = null, ytReady = null, scWidget = null, started = false;
let bot = "";                // the bot's username, for ☆ to send a track back

// --- ☆: saving a track to the bot's saved list -------------------------------
//
// An inline Mini App cannot send data to the bot directly. It can open a
// Telegram link, though, and "t.me/<bot>?start=sv_<token>" arrives in the chat
// as "/start sv_<token>": the bot saves the track the token names, then
// deletes both messages. Stars already pressed are remembered here.
const SAVED_KEY = "dig-player:saved";
function savedTokens() {
  try { return new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || "[]")); }
  catch (_) { return new Set(); }
}
function star(track) {
  if (!bot || !track.token) return;
  // ★ again takes the track back out of the saved list ("uv_").
  const saved = savedTokens();
  const undo = saved.has(track.token);
  const link = `https://t.me/${bot}?start=${undo ? "uv" : "sv"}_${track.token}`;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, "_blank");
  try {
    if (undo) saved.delete(track.token); else saved.add(track.token);
    localStorage.setItem(SAVED_KEY, JSON.stringify([...saved].slice(-500)));
  } catch (_) {}
  render();
}
// --- the apps: logged in, and they keep playing in the background ----------
//
// On a phone a page opened from here is a browser that is not logged in, and
// this player falls silent once it is out of sight. The services' own apps
// have neither problem.
//
// Bandcamp's app is opened by its scheme, and only this form shows the
// release (eight were tried on an iPhone, 2026-10-19, webapp/apptest.html):
//   x-bandcamp://show_tralbum?band_id=…&tralbum_type=a&tralbum_id=…
// Without band_id, with play=1, or by the signed https link, it opens on a
// blank screen. A Mini App can open only http(s) links, so the scheme goes
// through open.html. Both ids come from the bot's seventh field, "a123.456"
// (release or single "t…", then its band), read off the release page.
const PHONE = !!tg && ["ios", "android"].includes(tg.platform);

function bandcampScheme(track) {
  const found = /^([at])(\d+)\.(\d+)$/.exec(track.app || "");
  if (!found) return "";
  return `x-bandcamp://show_tralbum?band_id=${found[3]}&tralbum_type=${found[1]}&tralbum_id=${found[2]}`;
}

function bandcampApp(track) {
  const scheme = bandcampScheme(track);
  if (!scheme) return "";
  const page = new URL("open.html", location.href);
  page.hash = new URLSearchParams({ app: scheme, web: track.bc || "" }).toString();
  return page.toString();
}

// Where "in the app" goes for this track, or "" when there is no app link.
function appLink(track) {
  const bandcamp = bandcampApp(track);
  if (bandcamp) return bandcamp;
  if (track.p === "s") return "https://soundcloud.com/" + track.id;
  if (track.p === "y") return "https://music.youtube.com/watch?v=" + track.id;
  return "";
}

function openOutside(link) {
  if (tg) tg.openLink(link); else window.open(link, "_blank");
}

function bandcampButton(track) {
  const button = document.createElement("button");
  button.className = "bc";
  button.textContent = "BC ↗";
  button.title = "Открыть на Bandcamp";
  button.onclick = event => {
    event.stopPropagation();
    // On a phone, the app, where the login is; elsewhere the page.
    openOutside(PHONE && bandcampApp(track) ? bandcampApp(track) : track.bc);
  };
  return button;
}

// 🔎: dig on from this track — the bot answers in the chat with what sounds
// like it, as if "Artist - Title" had been typed ("dg_<token>").
function digButton(track) {
  const button = document.createElement("button");
  button.className = "star";
  button.textContent = "🔎";
  button.title = "Похожие на этот трек";
  button.onclick = event => {
    event.stopPropagation();
    const link = `https://t.me/${bot}?start=dg_${track.token}`;
    if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, "_blank");
  };
  return button;
}

function starButton(track) {
  const button = document.createElement("button");
  button.className = "star";
  const done = savedTokens().has(track.token);
  button.textContent = done ? "★" : "☆";
  button.title = done ? "Убрать из сохранённого" : "Сохранить в боте";
  button.onclick = event => { event.stopPropagation(); star(track); };
  return button;
}

// --- carrying on where the last player stopped ------------------------------
//
// Telegram Desktop hides a Mini App when another chat is opened, keeps its
// sound playing, and offers no way back to it. Opening "▶ Слушать" again
// starts a fresh page — so the old one is told to fall silent, and the new one
// picks up the same track at the same second. Position is kept per list, in
// this browser's local storage, for a few hours.
const STATE_KEY = "dig-player:" + [...location.hash].reduce(
  (h, c) => (Math.imul(h, 31) + c.charCodeAt(0)) | 0, 7).toString(36);
const STATE_TTL_MS = 6 * 3600 * 1000;
let position = 0;            // seconds into the current track
let resumeAt = 0;            // where to start the first track played, once

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ i: current, t: position, at: Date.now() }));
  } catch (_) { /* storage unavailable: resuming is a convenience */ }
}

function loadState() {
  try {
    const state = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (state && Date.now() - state.at < STATE_TTL_MS) return state;
  } catch (_) { /* nothing to resume */ }
  return null;
}

function pauseAll() {
  try { if (ytPlayer) ytPlayer.pauseVideo(); } catch (_) {}
  try { if (scWidget) scWidget.pause(); } catch (_) {}
}

// Another copy of this page opened (say, "▶ Слушать" pressed again after the
// window was hidden): note where this one is, and stop.
const channel = "BroadcastChannel" in window ? new BroadcastChannel("dig-player") : null;
const instance = Math.random().toString(36).slice(2);
if (channel) {
  channel.onmessage = event => {
    if (event.data && event.data.hello && event.data.hello !== instance) {
      saveState();
      pauseAll();
    }
  };
}

setInterval(() => {
  if (current < 0 || !started) return;
  const track = tracks[current];
  if (track.p === "y" && ytPlayer && ytPlayer.getCurrentTime) {
    position = ytPlayer.getCurrentTime() || 0;
    saveState();
  } else if (track.p === "s" && scWidget) {
    scWidget.getPosition(ms => { position = (ms || 0) / 1000; saveState(); });
  } else {
    saveState();
  }
}, 2000);

function clock(seconds) {
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function showError(text) {
  const box = document.getElementById("error");
  box.textContent = text;
  box.hidden = false;
}

function fromBase64url(text) {
  const b64 = text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4);
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function decode(fragment) {
  const params = new URLSearchParams(fragment.replace(/^#/, ""));
  bot = params.get("b") || "";
  const packed = params.get("t");
  if (!packed) return [];
  const stream = new Blob([fromBase64url(packed)]).stream()
    .pipeThrough(new DecompressionStream("deflate-raw"));
  const rows = JSON.parse(await new Response(stream).text());
  // [service, id, artist, title, token, bandcamp url]. Links made before the
  // token existed put the Bandcamp URL fifth; tell them apart by its shape.
  // A seventh field, when the bot has it, opens the release in the Bandcamp app;
  // an eighth is a release's track list, [[track id, title, artist?], …].
  return rows.flatMap(([p, id, artist, title, fifth, sixth, seventh, eighth]) => {
    if (fifth && fifth.startsWith("http")) return [{ p, id, artist, title, token: "", bc: fifth }];
    const row = { p, id, artist, title, token: fifth || "", bc: sixth, app: seventh || "" };
    return eighth && eighth.length > 1 ? releaseTracks(row, eighth) : [row];
  });
}

// A Bandcamp release, a track at a time: then this page knows which track is
// playing, and ☆ saves that track — Bandcamp's own player tells its page
// nothing (it posts one message, "playerinited", and nothing after). Each
// track is "album id:track id"; its ☆ token is the release's plus "-n",
// which the bot reads against the track list it kept. Bandcamp's player does
// not say when a track ends either, so the next one is ⏭ away.
function releaseTracks(release, listed) {
  return listed.map(([trackId, title, artist], index) => ({
    p: "b", id: `${release.id}:${trackId}`, artist: artist || release.artist, title,
    token: release.token ? `${release.token}-${index + 1}` : "",
    bc: release.bc, app: release.app,
    release: release.title, part: `${index + 1} из ${listed.length}`,
  }));
}

// A Bandcamp row with a numeric id is a whole release Bandcamp's own player
// can play; one with a URL instead can only be opened in the browser.
// A Bandcamp id is a release ("123"), a single track ("t123"), or one track
// of a release ("123:456").
function embeddable(track) { return track.p !== "b" || /^(t?\d+|\d+:\d+)$/.test(track.id); }

function url(track) {
  if (track.p === "y") return "https://www.youtube.com/watch?v=" + track.id;
  if (track.p === "s") return "https://soundcloud.com/" + track.id;
  return track.bc || track.id;
}

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  tracks.forEach((track, index) => {
    const li = document.createElement("li");
    if (index === current) li.className = "current";
    const n = document.createElement("span"); n.className = "n"; n.textContent = index + 1;
    const t = document.createElement("span"); t.className = "t";
    t.textContent = `${track.artist} — ${track.title}`;
    const p = document.createElement("span"); p.className = "p";
    p.textContent = track.part ? `Bandcamp · ${track.part}`
      : track.p === "b" && embeddable(track) ? (track.id.startsWith("t") ? "Bandcamp" : "Bandcamp · релиз")
      : LABEL[track.p];
    li.append(n, t, p);
    if (track.bc) li.append(bandcampButton(track));
    if (bot && track.token) li.append(digButton(track), starButton(track));
    li.onclick = () => { started = true; play(index); };
    list.append(li);
  });
  const now = document.getElementById("now");
  now.textContent = "";
  if (current >= 0) {
    const track = tracks[current];
    const a = document.createElement("div"); a.className = "artist"; a.textContent = track.artist;
    const t = document.createElement("div"); t.textContent = track.title;
    const w = document.createElement("div"); w.className = "where";
    w.textContent = `${current + 1} из ${tracks.length} · ${LABEL[track.p]}`;
    now.append(a, t, w);
    if (bot && track.token) {
      const saveNow = starButton(track);
      saveNow.id = "star";
      a.append(" ", saveNow, " ", digButton(track));
    }
    if (track.part) {
      w.textContent += ` · трек ${track.part} релиза «${track.release}»; к следующему — ⏭`;
    } else if (track.p === "b") {
      w.textContent += " · релиз целиком; к следующему — ⏭";
    }
    if (track.bc) {
      // The record's Bandcamp page: to follow the artist or label there.
      const bc = bandcampButton(track);
      bc.textContent = PHONE && bandcampApp(track) ? "В приложении Bandcamp ↗" : "Bandcamp ↗";
      now.append(bc);
    }
    // To listen with the screen locked or Telegram in use: the service's app.
    // Bandcamp's own button above already does that when it has the link.
    if (PHONE && !(track.bc && bandcampApp(track)) && appLink(track)) {
      const go = document.createElement("button");
      go.className = "bc";
      go.textContent = track.p === "s" ? "Слушать в SoundCloud ↗" : "Слушать в YouTube Music ↗";
      go.onclick = () => { pauseAll(); openOutside(appLink(track)); };
      now.append(go);
    }
  }
  document.getElementById("prev").disabled = step(current, -1) < 0;
  document.getElementById("next").disabled = step(current, 1) < 0;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.append(s);
  });
}

function youtube() {
  if (!ytReady) {
    ytReady = new Promise(resolve => {
      window.onYouTubeIframeAPIReady = () => {
        ytPlayer = new YT.Player("yt", {
          playerVars: { playsinline: 1, rel: 0 },
          events: {
            onReady: () => resolve(ytPlayer),
            onStateChange: e => { if (e.data === YT.PlayerState.ENDED) next(); },
            // 101/150: the uploader does not allow embedding. Skip it.
            onError: () => setTimeout(next, 1500),
          },
        });
      };
      loadScript("https://www.youtube.com/iframe_api").catch(() => showError("YouTube не загрузился"));
    });
  }
  return ytReady;
}

function clearSoundcloud() {
  for (const id of ["sc", "bc"]) {
    const old = document.getElementById(id);
    if (old) old.remove();
  }
  scWidget = null;
  document.getElementById("stage").classList.remove("sc", "bc");
}

function hex(cssVar, fallback) {
  const value = getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim();
  return /^#[0-9a-f]{6}$/i.test(value) ? value.slice(1) : fallback;
}

async function play(index) {
  if (index < 0 || index >= tracks.length) return;
  const startAt = index === current ? resumeAt : 0;
  resumeAt = 0;
  position = startAt;
  current = index;
  announce(tracks[index]);
  render();
  const track = tracks[index];
  document.getElementById("start").hidden = started;

  if (track.p === "y") {
    clearSoundcloud();
    document.getElementById("yt").style.visibility = "visible";
    const player = await youtube();
    const video = { videoId: track.id, startSeconds: startAt };
    if (started) player.loadVideoById(video); else player.cueVideoById(video);
  } else if (track.p === "s") {
    if (ytPlayer) { ytPlayer.stopVideo(); }
    document.getElementById("yt").style.visibility = "hidden";
    clearSoundcloud();
    const stage = document.getElementById("stage");
    stage.classList.add("sc");
    const frame = document.createElement("iframe");
    frame.id = "sc";
    frame.allow = "autoplay";
    // Not on a phone: there iOS lets the widget's sound start only from a tap
    // inside the widget, so asked to start by itself it covers itself with a
    // full-size "Play on SoundCloud / Listen in browser" screen (its
    // "mobilePrestitial") to get that tap. Its own ▶ asks for the same one tap
    // without covering anything.
    frame.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(url(track)) +
      "&auto_play=" + (started && !PHONE ? "true" : "false") + "&visual=false&show_comments=false";
    stage.append(frame);
    if (!window.SC) await loadScript("https://w.soundcloud.com/player/api.js");
    scWidget = SC.Widget(frame);
    scWidget.bind(SC.Widget.Events.FINISH, () => next());
    if (startAt > 0) {
      // The widget can only seek once it is playing.
      const widget = scWidget;
      const seek = () => { widget.seekTo(startAt * 1000); widget.unbind(SC.Widget.Events.PLAY); };
      widget.bind(SC.Widget.Events.PLAY, seek);
    }
  } else if (embeddable(track)) {
    // The whole release in Bandcamp's own player, track list included. It
    // reports nothing back, so the queue waits for ⏭ here.
    if (ytPlayer) { ytPlayer.stopVideo(); }
    document.getElementById("yt").style.visibility = "hidden";
    clearSoundcloud();
    const stage = document.getElementById("stage");
    stage.classList.add("bc");
    const frame = document.createElement("iframe");
    frame.id = "bc";
    frame.allow = "autoplay";
    const [albumId, trackId] = track.id.split(":");
    const single = track.id.startsWith("t") || !!trackId;
    frame.src = "https://bandcamp.com/EmbeddedPlayer/" +
      (trackId ? `album=${albumId}/track=${trackId}`
       : track.id.startsWith("t") ? "track=" + track.id.slice(1) : "album=" + track.id) +
      // A release: small artwork, so the frame's height goes to the track
      // list — on an iPhone the list inside the frame cannot be scrolled, so
      // what does not fit cannot be reached. A single has no list: big art.
      "/size=large/bgcol=" + hex("--bg", "ffffff") + "/linkcol=" + hex("--accent", "0687f5") +
      (single ? "/tracklist=false" : "/artwork=small/tracklist=true") + "/transparent=true/";
    stage.append(frame);
  } else {
    // Bandcamp with no release id: open it in the browser.
    if (tg) tg.openLink(url(track)); else window.open(url(track), "_blank");
  }
}

// The queue moves past Bandcamp rows it cannot embed: opening a browser by
// itself in the middle of listening would be worse than skipping. Tapping
// one opens it.
function step(from, direction) {
  for (let i = from + direction; i >= 0 && i < tracks.length; i += direction) {
    if (embeddable(tracks[i])) return i;
  }
  return -1;
}
function next() { const i = step(current, 1); if (i >= 0) play(i); }

document.getElementById("prev").onclick = () => {
  const i = step(current, -1); if (i >= 0) { started = true; play(i); }
};
document.getElementById("next").onclick = () => { started = true; next(); };

// Headphone and keyboard ⏮ ⏭: the Media Session API. The sound itself plays
// inside the services' frames, and the system may hand those keys to the
// frame that plays rather than to this page — where it does reach this page,
// the keys move through this list.
if ("mediaSession" in navigator) {
  const handle = (action, run) => {
    try { navigator.mediaSession.setActionHandler(action, run); } catch (_) { /* unsupported action */ }
  };
  handle("previoustrack", () => document.getElementById("prev").onclick());
  handle("nexttrack", () => document.getElementById("next").onclick());
}

function announce(track) {
  if (!("mediaSession" in navigator) || !window.MediaMetadata) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata(
      { title: track.title, artist: track.artist, album: track.release || "" });
  } catch (_) { /* metadata is a nicety */ }
}
document.getElementById("open").onclick = () => {
  if (current < 0) return;
  if (tg) tg.openLink(url(tracks[current])); else window.open(url(tracks[current]), "_blank");
};
document.getElementById("start").onclick = () => {
  started = true;
  document.getElementById("start").hidden = true;
  play(current < 0 ? 0 : current);
};

(async () => {
  try {
    tracks = await decode(location.hash);
  } catch (err) {
    showError("Не получилось прочитать список треков.");
    return;
  }
  if (!tracks.length) { showError("В подборке нет треков, которые можно проиграть."); return; }
  const first = tracks.findIndex(embeddable);
  current = first < 0 ? 0 : first;
  if (channel) {
    channel.postMessage({ hello: instance });
    // Give an older copy a moment to note its place before reading it.
    await new Promise(resolve => setTimeout(resolve, 400));
  }
  const saved = loadState();
  if (saved && saved.i >= 0 && saved.i < tracks.length && embeddable(tracks[saved.i])) {
    current = saved.i;
    resumeAt = saved.t > 5 ? saved.t : 0;
    if (resumeAt) {
      document.getElementById("start").textContent = `▶ Продолжить с ${clock(resumeAt)}`;
    }
  }
  render();
  document.getElementById("start").hidden = false;
  if (tracks[current].p === "y") {
    youtube().then(p => p.cueVideoById({ videoId: tracks[current].id, startSeconds: resumeAt }));
  }
})();
</script>
</body>
</html>
